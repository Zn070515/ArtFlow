name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: Linux SQLite quality gate
    runs-on: ubuntu-latest
    # Coverage makes the Linux suite materially slower than the Windows
    # application-only jobs. Keep the quality gate within the same bounded
    # window as the supported application gates, with room for the expanded
    # questionnaire surface.
    timeout-minutes: 30
    env:
      APP_ENV: development
      DEBUG: "False"
      DATABASE_ENGINE: sqlite
      ARTFLOW_CADDY_TEST_IMAGE: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
      ARTFLOW_REQUIRE_CADDY_RUNTIME: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify compiled static assets
        run: npm ci && npm run check:css

      - name: Verify compiled Rapid Score client
        run: npm run check:client

      - name: Collect static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Run Rapid Score client regression
        run: npm run test:client

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Run entry access Pyright gate
        run: npm run check:pyright:entry-access

      - name: Run project Pyright gate
        run: npm run check:pyright

      - name: Run Django checks
        run: uv run python manage.py check

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Pull pinned Caddy runtime test image
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..3}; do
            if docker pull "$ARTFLOW_CADDY_TEST_IMAGE"; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep 10
            fi
          done
          exit 1

      - name: Run tests with coverage
        run: >-
          uv run pytest -q
          -n auto
          --maxprocesses=4
          --dist=loadscope
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --durations=30

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-linux-sqlite
          path: coverage.xml
          if-no-files-found: error

  windows:
    name: Windows Python ${{ matrix.python-version }} application gate
    runs-on: windows-latest
    # The full suite runs once per supported Windows interpreter.
    # The expanded application suite takes about 35 minutes on a shared
    # Windows runner. Keep the gate bounded while allowing pytest and normal
    # artifact cleanup to finish.
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      APP_ENV: development
      DEBUG: "False"
      DATABASE_ENGINE: sqlite
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"

      - name: Verify matrix Python interpreter
        shell: pwsh
        run: |
          $expected = "${{ matrix.python-version }}"
          $actual = (uv run python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($actual -ne $expected) {
            throw "uv selected Python $actual instead of matrix target $expected"
          }

      - name: Collect static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Run Django checks
        run: uv run python manage.py check

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run application tests
        run: >-
          uv run pytest -q
          -n auto
          --maxprocesses=4
          --dist=loadscope
          --durations=30
