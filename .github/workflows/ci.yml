name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: Linux SQLite quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      DEBUG: "False"
      DATABASE_ENGINE: sqlite
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify compiled static assets
        run: npm ci && npm run check:css

      - name: Verify compiled Rapid Score client
        run: npm run check:client

      - name: Collect static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Run Rapid Score client regression
        run: npm run test:client

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Run entry access Pyright gate
        run: npm run check:pyright:entry-access

      - name: Run Django checks
        run: uv run python manage.py check

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-linux-sqlite
          path: coverage.xml
          if-no-files-found: error

  windows:
    name: Windows Python ${{ matrix.python-version }} application gate
    runs-on: windows-latest
    # The full suite runs once per supported Windows interpreter.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      APP_ENV: development
      DEBUG: "False"
      DATABASE_ENGINE: sqlite
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Collect static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Run Django checks
        run: uv run python manage.py check

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run application tests
        run: uv run pytest -q
