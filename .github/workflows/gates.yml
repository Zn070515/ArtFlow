name: Gates

# The v1 production line is frozen on main. These structural gates live on the
# ArtFlow-Plus line and run for every change that will become v2.
on:
  push:
    branches: [artflow-plus]
  pull_request:
    branches: [artflow-plus]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Structural and golden gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: artflow
          POSTGRES_PASSWORD: artflow_dev
          POSTGRES_DB: artflow_plus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artflow -d artflow_plus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARTFLOW_PLUS_DATABASE_URL: postgresql://artflow:artflow_dev@127.0.0.1:5432/artflow_plus
      # A skipped database test must fail CI, not silently pass.
      REQUIRE_DB: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plus/pnpm-lock.yaml

      - name: Install the locked development environment
        run: uv sync --locked --extra dev

      - name: Install the Plus workspace
        run: pnpm -C plus install --frozen-lockfile

      - name: Type-check the Plus domain
        run: pnpm -C plus run check

      - name: Test the Plus domain
        run: pnpm -C plus run test

      - name: Run structural gates
        run: uv run pytest tests/gates -q

      - name: Validate golden fixtures
        run: uv run python tests/golden/validate_fixtures.py

      - name: Run the golden fixtures with a v1 adapter
        run: uv run python manage.py test tests.golden --noinput

      - name: Lint the gate code
        run: uv run ruff check tests/gates tests/golden

  web-e2e:
    name: Web public journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: artflow
          POSTGRES_PASSWORD: artflow_dev
          POSTGRES_DB: artflow_plus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artflow -d artflow_plus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARTFLOW_PLUS_DATABASE_URL: postgresql://artflow:artflow_dev@127.0.0.1:5432/artflow_plus
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plus/pnpm-lock.yaml

      - name: Install the Plus workspace
        run: pnpm -C plus install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C plus --filter @artflow-plus/web exec playwright install --with-deps chromium

      - name: Run the public results journey
        run: pnpm -C plus --filter @artflow-plus/web test:e2e
