name: Gates

# The v1 production line is frozen on main. These structural gates live on the
# ArtFlow-Plus line and run for every change that will become v2.
on:
  push:
    branches: [artflow-plus]
  pull_request:
    branches: [artflow-plus]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Structural and golden gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install the locked development environment
        run: uv sync --locked --extra dev

      - name: Run structural gates
        run: uv run pytest tests/gates -q

      - name: Validate golden fixtures
        run: uv run python tests/golden/validate_fixtures.py

      - name: Run the golden fixtures with a v1 adapter
        run: uv run python manage.py test tests.golden --noinput

      - name: Lint the gate code
        run: uv run ruff check tests/gates tests/golden
