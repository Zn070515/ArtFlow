name: PostgreSQL integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql:
    name: PostgreSQL integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: artflow_ci
          POSTGRES_USER: artflow_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U artflow_ci -d artflow_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - "127.0.0.1:5432:5432"
    env:
      APP_ENV: development
      DEBUG: "False"
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: artflow_ci
      POSTGRES_USER: artflow_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Prepare runtime directories
        run: mkdir -p staticfiles media

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Run runtime diagnostics
        run: uv run python manage.py doctor

      - name: Check health endpoint
        run: >-
          uv run python manage.py shell -c
          "from django.test import Client; response = Client().get('/healthz/');
          raise SystemExit(0 if response.status_code == 200 else response.status_code)"

      - name: Seed demo data twice
        run: |
          uv run python manage.py seed_demo_data
          uv run python manage.py seed_demo_data

      - name: Run full test suite
        run: uv run pytest -q
