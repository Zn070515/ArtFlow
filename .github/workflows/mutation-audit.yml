name: Mutation audit

# L5 is nightly and manual. It rewrites source files temporarily, so it does
# not run on pull requests. --strict fails the job when a mutation survives
# or its anchor no longer matches.
on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-audit:
    name: Strict mutation audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: artflow
          POSTGRES_PASSWORD: artflow_dev
          POSTGRES_DB: artflow_plus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artflow -d artflow_plus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARTFLOW_PLUS_DATABASE_URL: postgresql://artflow:artflow_dev@127.0.0.1:5432/artflow_plus
      REQUIRE_DB: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plus/pnpm-lock.yaml

      - name: Install the Plus workspace
        run: pnpm -C plus install --frozen-lockfile

      - name: Run the mutation audit strictly
        run: pnpm -C plus --filter @artflow-plus/contract-tools exec tsx src/audit/mutation-cli.ts --strict
