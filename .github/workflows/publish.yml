name: Publish release image

# A tag is the release authority. Ordinary main commits must never publish a package;
# only an explicit version tag does.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the release image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve the lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # A tag is the release authority, but it must not be stronger than CI. The same
      # commit's main-branch runs are the evidence: a tag pushed before those gates finish
      # (or from a commit that never passed them) must not produce a formal package.
      - name: Require green quality gates for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          for workflow in ci.yml security.yml workflow-lint.yml integration.yml; do
            count="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${workflow}/runs?head_sha=${sha}&branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length')"
            if [ "$count" -lt 1 ]; then
              echo "::error::No successful ${workflow} run on main for ${sha}; refusing to publish."
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version tags and OCI labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The runtime refuses to start in production unless this baked value matches
          # the value configured on the host. The tag commit is therefore the only
          # correct input.
          build-args: |
            ARTFLOW_BUILD_SHA=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the published digest
        run: |
          {
            echo "### Published image"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; leaving it unchanged."
          else
            gh release create "${{ github.ref_name }}" \
              --title "ArtFlow ${{ github.ref_name }}" \
              --notes-from-tag
          fi
