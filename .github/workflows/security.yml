name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Plus production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plus/pnpm-lock.yaml

      - name: Install the locked Plus workspace
        run: pnpm -C plus install --frozen-lockfile

      - name: Audit production dependencies
        # Some mirrored registries do not implement the npm audit endpoint.
        run: pnpm -C plus audit --prod --audit-level high --registry=https://registry.npmjs.org

  codeql:
    name: CodeQL JavaScript/TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          output: codeql-results

      - name: Evaluate CodeQL SARIF
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import sys

          # Location-specific exceptions, each justified by a control CodeQL
          # cannot model. Keep this list narrow: an exception that no longer
          # matches the reported location fails the build and must be reviewed.
          allowed = {
              # requirePublicRateLimit enforces the route budget; the rule does
              # not recognize the project's custom limiter.
              "js/missing-rate-limiting:plus/apps/api/src/routes/auth.ts:22",
              "js/missing-rate-limiting:plus/apps/api/src/routes/auth.ts:42",
              "js/missing-rate-limiting:plus/apps/api/src/routes/public.ts:38",
              # boundedTimer clamps every heartbeat value to 1s-120s.
              "js/resource-exhaustion:plus/packages/realtime/src/client/client.ts:100",
              "js/resource-exhaustion:plus/packages/realtime/src/client/client.ts:101",
          }
          findings = []
          for path in glob.glob("codeql-results/**/*.sarif", recursive=True):
              data = json.load(open(path, encoding="utf-8"))
              for run in data.get("runs", []):
                  for result in run.get("results", []):
                      suppressions = result.get("suppressions") or []
                      if suppressions and all(
                          item.get("status") == "accepted" for item in suppressions
                      ):
                          continue
                      location = (result.get("locations") or [{}])[0].get(
                          "physicalLocation", {}
                      )
                      uri = location.get("artifactLocation", {}).get("uri", "?")
                      line = location.get("region", {}).get("startLine", "?")
                      rule = result.get("ruleId", "unknown")
                      if f"{rule}:{uri}:{line}" in allowed:
                          continue
                      findings.append(f"{rule} at {uri}:{line}")
          if findings:
              print("CodeQL findings:")
              for finding in sorted(set(findings)):
                  print(f"  - {finding}")
              raise SystemExit(1)
          PY

  secret-scan:
    name: Working-tree secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir --parents "$install_dir" "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          install --mode 0755 "$install_dir/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the working tree
        # The archived v1 history is preserved in tag v1.0.2 and is not part of
        # the active tree; a full-history scan is a separate, explicit audit.
        shell: bash
        run: gitleaks dir --redact --config .gitleaks.toml .
