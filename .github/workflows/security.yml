name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export and compare frozen production dependencies
        id: production-requirements
        shell: bash
        run: |
          export_file="$RUNNER_TEMP/requirements-production.txt"
          normalized_export="$RUNNER_TEMP/requirements-production-normalized.txt"
          uv export --frozen --no-dev --extra production --no-emit-project --output-file "$export_file"
          sed -E 's|^#    uv export .+$|#    uv export --frozen --no-dev --extra production --no-emit-project -o requirements.txt|' "$export_file" > "$normalized_export"
          cmp --silent requirements.txt "$normalized_export"
          echo "requirements_file=$export_file" >> "$GITHUB_OUTPUT"

      - name: Audit frozen production dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement "${{ steps.production-requirements.outputs.requirements_file }}"

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          languages: python

      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1

      - name: Analyze with CodeQL
        id: codeql-analysis
        # Keep publishing enabled; the next step evaluates local SARIF only when
        # repository settings prevent Code Scanning from accepting the upload.
        continue-on-error: true
        uses: github/codeql-action/analyze@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          upload: always
          output: codeql-results

      - name: Evaluate CodeQL SARIF fallback
        if: ${{ always() }}
        env:
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
          CODEQL_SARIF_DIRECTORY: codeql-results
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_directory = Path(os.environ["CODEQL_SARIF_DIRECTORY"])
          sarif_files = sorted(sarif_directory.rglob("*.sarif"))
          if not sarif_files:
              raise SystemExit("CodeQL did not produce SARIF results for local evaluation")

          findings = []
          for sarif_file in sarif_files:
              sarif = json.loads(sarif_file.read_text(encoding="utf-8"))
              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      if result.get("suppressions"):
                          continue
                      findings.append(result.get("ruleId", "unknown CodeQL rule"))

          if findings:
              print("CodeQL findings: " + ", ".join(sorted(set(findings))))
              raise SystemExit(1)
          if os.environ["CODEQL_ANALYSIS_OUTCOME"] != "success":
              print(
                  "CodeQL SARIF upload did not complete; local evaluation passed with no findings. "
                  "Enable Code Scanning in repository settings to publish alerts."
              )
          PY

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
