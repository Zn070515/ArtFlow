name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export and compare frozen production dependencies
        id: production-requirements
        shell: bash
        run: |
          export_file="$RUNNER_TEMP/requirements-production.txt"
          normalized_export="$RUNNER_TEMP/requirements-production-normalized.txt"
          uv export --frozen --no-dev --extra production --no-emit-project --output-file "$export_file"
          sed -E 's|^#    uv export .+$|#    uv export --frozen --no-dev --extra production --no-emit-project -o requirements.txt|' "$export_file" > "$normalized_export"
          cmp --silent requirements.txt "$normalized_export"
          echo "requirements_file=$export_file" >> "$GITHUB_OUTPUT"

      - name: Audit frozen production dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement "${{ steps.production-requirements.outputs.requirements_file }}"

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1722c1245f90604c2c348f9d1624af97ea8fc6e # v3.29.0
        with:
          languages: python

      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@b1722c1245f90604c2c348f9d1624af97ea8fc6e # v3.29.0

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@b1722c1245f90604c2c348f9d1624af97ea8fc6e # v3.29.0
        with:
          upload: never

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          args: detect --source . --log-opts=--all --redact
