name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Plus production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plus/pnpm-lock.yaml

      - name: Install the locked Plus workspace
        run: pnpm -C plus install --frozen-lockfile

      - name: Audit production dependencies
        # Some mirrored registries do not implement the npm audit endpoint.
        run: pnpm -C plus audit --prod --audit-level high --registry=https://registry.npmjs.org

  codeql:
    name: CodeQL JavaScript/TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          upload: never
          output: codeql-results

      - name: Evaluate CodeQL SARIF
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import sys

          findings = []
          for path in glob.glob("codeql-results/**/*.sarif", recursive=True):
              data = json.load(open(path, encoding="utf-8"))
              for run in data.get("runs", []):
                  for result in run.get("results", []):
                      suppressions = result.get("suppressions") or []
                      if suppressions and all(
                          item.get("status") == "accepted" for item in suppressions
                      ):
                          continue
                      findings.append(result.get("ruleId", "unknown"))
          if findings:
              print("CodeQL findings: " + ", ".join(sorted(set(findings))))
              raise SystemExit(1)
          PY

  secret-scan:
    name: Working-tree secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir --parents "$install_dir" "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          install --mode 0755 "$install_dir/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the working tree
        # The archived v1 history is preserved in tag v1.0.2 and is not part of
        # the active tree; a full-history scan is a separate, explicit audit.
        shell: bash
        run: gitleaks dir --redact --config .gitleaks.toml .
