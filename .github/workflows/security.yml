name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export and compare frozen production dependencies
        id: production-requirements
        shell: bash
        run: |
          export_file="$RUNNER_TEMP/requirements-production.txt"
          normalized_export="$RUNNER_TEMP/requirements-production-normalized.txt"
          uv export --frozen --no-dev --extra production --no-emit-project --output-file "$export_file"
          sed -E 's|^#    uv export .+$|#    uv export --frozen --no-dev --extra production --no-emit-project -o requirements.txt|' "$export_file" > "$normalized_export"
          cmp --silent requirements.txt "$normalized_export"
          echo "requirements_file=$export_file" >> "$GITHUB_OUTPUT"

      - name: Audit frozen production dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement "${{ steps.production-requirements.outputs.requirements_file }}"

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          languages: python

      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          upload: never
          output: codeql-results

      - name: Evaluate CodeQL SARIF
        env:
          CODEQL_SARIF_DIRECTORY: codeql-results
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)

          def has_accepted_suppression(result, sarif_file):
              suppressions = result.get("suppressions")
              if suppressions is None or suppressions == []:
                  return False
              if not isinstance(suppressions, list) or not all(
                  isinstance(suppression, dict)
                  and suppression.get("kind") in {"inSource", "external"}
                  for suppression in suppressions
              ):
                  fail(f"{sarif_file}: invalid SARIF suppression")
              if not all(suppression.get("status") == "accepted" for suppression in suppressions):
                  fail(f"{sarif_file}: unaccepted SARIF suppression")
              return True

          sarif_directory = Path(os.environ["CODEQL_SARIF_DIRECTORY"])
          sarif_files = sorted(sarif_directory.rglob("*.sarif"))
          if not sarif_files:
              fail("CodeQL did not produce SARIF results for local evaluation")

          findings = []
          for sarif_file in sarif_files:
              try:
                  sarif = json.loads(sarif_file.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  fail(f"{sarif_file}: invalid SARIF: {error}")
              if not isinstance(sarif, dict) or sarif.get("version") != "2.1.0":
                  fail(f"{sarif_file}: invalid SARIF version")
              runs = sarif.get("runs")
              if not isinstance(runs, list) or not runs:
                  fail(f"{sarif_file}: invalid SARIF runs")
              for run in runs:
                  if not isinstance(run, dict):
                      fail(f"{sarif_file}: invalid SARIF run")
                  tool = run.get("tool")
                  driver = tool.get("driver") if isinstance(tool, dict) else None
                  driver_name = driver.get("name") if isinstance(driver, dict) else None
                  if not isinstance(driver_name, str) or "codeql" not in driver_name.lower():
                      fail(f"{sarif_file}: invalid CodeQL SARIF tool metadata")
                  invocations = run.get("invocations")
                  if not isinstance(invocations, list) or not invocations or any(
                      not isinstance(invocation, dict)
                      or invocation.get("executionSuccessful") is not True
                      for invocation in invocations
                  ):
                      fail(f"{sarif_file}: CodeQL analysis was not successful")
                  results = run.get("results")
                  if not isinstance(results, list):
                      fail(f"{sarif_file}: invalid SARIF results")
                  for result in results:
                      if not isinstance(result, dict) or not isinstance(result.get("ruleId"), str):
                          fail(f"{sarif_file}: invalid SARIF result")
                      if has_accepted_suppression(result, sarif_file):
                          continue
                      findings.append(result.get("ruleId", "unknown CodeQL rule"))

          if findings:
              print("CodeQL findings: " + ", ".join(sorted(set(findings))))
              raise SystemExit(1)
          PY

      - name: Upload evaluated CodeQL SARIF
        if: ${{ always() && hashFiles('codeql-results/**/*.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: codeql-results

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir --parents "$install_dir" "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          install --mode 0755 "$install_dir/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan all reachable Git commits with Gitleaks
        shell: bash
        run: |
          git rev-list --all --count
          gitleaks git --redact --config .gitleaks.toml --log-opts="--all" .
