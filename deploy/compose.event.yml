# Local event operation only. Do not publish this stack directly to the Internet.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the event environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the event environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the event environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - artflow_event_frontend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - artflow_event_frontend

  web:
    build:
      context: ..
      args:
        ARTFLOW_BUILD_SHA: ${ARTFLOW_RELEASE_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the event environment}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:?Set QR_SIGNING_KEY in the event environment}
      STAFF_ACCESS_KEY: ${STAFF_ACCESS_KEY:?Set STAFF_ACCESS_KEY in the event environment}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?Set ADMIN_ACCESS_KEY in the event environment}
      ARTFLOW_ORGANIZATION_NAME: ${ARTFLOW_ORGANIZATION_NAME:-}
      ARTFLOW_ICP_NUMBER: ${ARTFLOW_ICP_NUMBER:-}
      ARTFLOW_ICP_URL: ${ARTFLOW_ICP_URL:-}
      ARTFLOW_RELEASE_SHA: ${ARTFLOW_RELEASE_SHA:-}
      ARTFLOW_PROCESS_ROLE: web
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      ALLOWED_HOSTS: ${ARTFLOW_EVENT_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ""
      TRUST_X_FORWARDED_FOR: "true"
      RATE_LIMIT_BACKEND: database
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the event environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the event environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the event environment}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - backup_data:/app/backups
    # Liveness only: an on-site database blip must not mark the running event
    # stack dead. Database readiness stays available at /readyz/ and /healthz/.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/livez/', timeout=3); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - artflow_event_frontend

  realtime:
    build:
      context: ..
      args:
        ARTFLOW_BUILD_SHA: ${ARTFLOW_RELEASE_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # `service_started`, not `service_healthy`, exactly as in the production manifest:
      # Redis is an enhancement dependency, and gating on its health means the container
      # is never created at all. `proxy` below only waits for `realtime` to exist, so an
      # unhealthy Redis would leave that wait permanently unsatisfied and take the whole
      # event stack — including `/healthz/` and every scoring and voting mutation — down
      # on the machine that has no other fallback. `restart: unless-stopped` retries the
      # process until Redis accepts connections.
      redis:
        condition: service_started
    environment:
      APP_ENV: development
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the event environment}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:?Set QR_SIGNING_KEY in the event environment}
      STAFF_ACCESS_KEY: ${STAFF_ACCESS_KEY:?Set STAFF_ACCESS_KEY in the event environment}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?Set ADMIN_ACCESS_KEY in the event environment}
      ARTFLOW_ORGANIZATION_NAME: ${ARTFLOW_ORGANIZATION_NAME:-}
      ARTFLOW_ICP_NUMBER: ${ARTFLOW_ICP_NUMBER:-}
      ARTFLOW_ICP_URL: ${ARTFLOW_ICP_URL:-}
      ARTFLOW_RELEASE_SHA: ${ARTFLOW_RELEASE_SHA:-}
      ARTFLOW_PROCESS_ROLE: realtime
      ARTFLOW_REALTIME_REDIS_URL: redis://redis:6379/0
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      ALLOWED_HOSTS: ${ARTFLOW_EVENT_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ""
      RATE_LIMIT_BACKEND: database
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the event environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the event environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the event environment}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "config.asgi:application"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8001/livez/', timeout=3); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - artflow_event_frontend

  # Same image, same database, same controlled_media view as `web` — only the worker pool
  # is separate, so a slow download cannot take the scoring, voting and judge requests with
  # it. See docs/production-readiness.md (media download load rehearsal).
  media:
    build:
      context: ..
      args:
        ARTFLOW_BUILD_SHA: ${ARTFLOW_RELEASE_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the event environment}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:?Set QR_SIGNING_KEY in the event environment}
      STAFF_ACCESS_KEY: ${STAFF_ACCESS_KEY:?Set STAFF_ACCESS_KEY in the event environment}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?Set ADMIN_ACCESS_KEY in the event environment}
      ARTFLOW_ORGANIZATION_NAME: ${ARTFLOW_ORGANIZATION_NAME:-}
      ARTFLOW_ICP_NUMBER: ${ARTFLOW_ICP_NUMBER:-}
      ARTFLOW_ICP_URL: ${ARTFLOW_ICP_URL:-}
      ARTFLOW_RELEASE_SHA: ${ARTFLOW_RELEASE_SHA:-}
      ARTFLOW_PROCESS_ROLE: media
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      ALLOWED_HOSTS: ${ARTFLOW_EVENT_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ""
      RATE_LIMIT_BACKEND: database
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the event environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the event environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the event environment}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8002",
        "--workers",
        "2",
        "--timeout",
        "120",
        "--graceful-timeout",
        "30",
      ]
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8002/livez/', timeout=3); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - artflow_event_frontend

  # The single origin this profile publishes. Everything the browser does is same-origin,
  # exactly as behind the production proxy; see deploy/Caddyfile.event.
  proxy:
    image: ${ARTFLOW_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      media:
        condition: service_healthy
      # The container must exist so Caddy can resolve the upstream when it loads its
      # config; it does not have to be healthy. Requiring health made a Redis outage take
      # the whole HTTP site down with it.
      realtime:
        condition: service_started
    ports:
      - "${ARTFLOW_EVENT_BIND_ADDRESS:-127.0.0.1}:${ARTFLOW_EVENT_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/livez/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    configs:
      - source: caddyfile_event
        target: /etc/caddy/Caddyfile
    networks:
      - artflow_event_frontend

volumes:
  postgres_data:
  static_data:
  media_data:
  backup_data:

networks:
  # The proxy must stay on a normal bridge for Docker Desktop to publish its
  # loopback-only host port; web, media and realtime talk to it over the same network and
  # publish nothing. The database remains unpublished; this profile is still
  # host-loopback-only and never replaces production's internal frontend/backend topology.
  artflow_event_frontend:
    driver: bridge
    internal: false
configs:
  caddyfile_event:
    file: ./Caddyfile.event
