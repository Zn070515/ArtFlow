services:
  plus-db:
    image: ${ARTFLOW_POSTGRES_IMAGE:?Set ARTFLOW_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLUS_POSTGRES_DB:-artflow_plus}
      POSTGRES_USER: ${PLUS_POSTGRES_USER:?Set PLUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PLUS_POSTGRES_PASSWORD:?Set PLUS_POSTGRES_PASSWORD}
    volumes:
      - plus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - artflow_internal

  plus-api:
    image: ${ARTFLOW_PLUS_API_IMAGE:?Set ARTFLOW_PLUS_API_IMAGE}
    restart: unless-stopped
    depends_on:
      plus-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ARTFLOW_RELEASE_SHA: ${ARTFLOW_RELEASE_SHA:?Set ARTFLOW_RELEASE_SHA}
      ARTFLOW_PLUS_DATABASE_URL: postgresql://${PLUS_POSTGRES_USER}:${PLUS_POSTGRES_PASSWORD}@plus-db:5432/${PLUS_POSTGRES_DB:-artflow_plus}
      ARTFLOW_PLUS_CREDENTIAL_SECRET: ${ARTFLOW_PLUS_CREDENTIAL_SECRET:?Set ARTFLOW_PLUS_CREDENTIAL_SECRET}
      ARTFLOW_PLUS_TRUST_PROXY: ${ARTFLOW_PLUS_TRUST_PROXY:-}
      ARTFLOW_PLUS_INLINE_RELAY: "0"
      ARTFLOW_PLUS_ARCHIVE_DIR: /app/var/archives
      ARTFLOW_PLUS_MEDIA_DIR: /app/var/media
    volumes:
      - plus_archive_data:/app/var/archives
      - plus_media_data:/app/var/media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - artflow_internal

  plus-worker:
    image: ${ARTFLOW_PLUS_WORKER_IMAGE:?Set ARTFLOW_PLUS_WORKER_IMAGE}
    restart: unless-stopped
    depends_on:
      plus-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: production
      ARTFLOW_RELEASE_SHA: ${ARTFLOW_RELEASE_SHA:?Set ARTFLOW_RELEASE_SHA}
      ARTFLOW_PLUS_DATABASE_URL: postgresql://${PLUS_POSTGRES_USER}:${PLUS_POSTGRES_PASSWORD}@plus-db:5432/${PLUS_POSTGRES_DB:-artflow_plus}
      ARTFLOW_PLUS_WORKER_READY_FILE: /tmp/artflow-worker-ready
      ARTFLOW_PLUS_WORKER_RELAY_INTERVAL_MS: ${ARTFLOW_PLUS_WORKER_RELAY_INTERVAL_MS:-250}
      ARTFLOW_PLUS_WORKER_SHUTDOWN_TIMEOUT_MS: ${ARTFLOW_PLUS_WORKER_SHUTDOWN_TIMEOUT_MS:-10000}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/artflow-worker-ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - artflow_internal

  plus-web:
    image: ${ARTFLOW_PLUS_WEB_IMAGE:?Set ARTFLOW_PLUS_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      plus-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - artflow_internal

  proxy:
    image: ${ARTFLOW_CADDY_IMAGE:?Set ARTFLOW_CADDY_IMAGE}
    restart: unless-stopped
    depends_on:
      plus-web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/healthz/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS to the public DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/sites:/etc/caddy/sites:ro
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - artflow_frontend
      - artflow_internal

volumes:
  plus_postgres_data:
  plus_archive_data:
  plus_media_data:
  caddy_data:
  caddy_config:

networks:
  artflow_frontend:
    driver: bridge
  artflow_internal:
    internal: true

configs:
  caddyfile:
    file: ./caddy/Caddyfile.plus
