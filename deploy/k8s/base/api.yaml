apiVersion: apps/v1
kind: Deployment
metadata:
  name: plus-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: plus-api
  template:
    metadata:
      labels:
        app: plus-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: artflow-plus-api
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: plus-config
            - secretRef:
                name: plus-secrets
          volumeMounts:
            - name: media
              mountPath: /app/var/media
            - name: archives
              mountPath: /app/var/archives
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: plus-media
        - name: archives
          persistentVolumeClaim:
            claimName: plus-archives
