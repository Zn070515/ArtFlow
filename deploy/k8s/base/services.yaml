apiVersion: v1
kind: Service
metadata:
  name: plus-db
spec:
  selector:
    app: plus-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: plus-api
spec:
  selector:
    app: plus-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plus-web
spec:
  selector:
    app: plus-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plus-proxy
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: plus-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
