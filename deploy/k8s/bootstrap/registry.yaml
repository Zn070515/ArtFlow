apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artflow-registry-data
  namespace: artflow-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artflow-registry
  namespace: artflow-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artflow-registry
  template:
    metadata:
      labels:
        app: artflow-registry
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k8s-control
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: registry
          image: docker.m.daocloud.io/library/registry:2
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: artflow-registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: artflow-registry
  namespace: artflow-system
spec:
  selector:
    app: artflow-registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
