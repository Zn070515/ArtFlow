apiVersion: v1
kind: Secret
metadata:
  name: plus-db-s3
  namespace: artflow-dev
type: Opaque
stringData:
  ACCESS_KEY_ID: replace-with-s3-access-key
  SECRET_ACCESS_KEY: replace-with-s3-secret-key
  REGION: us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: plus-db-app
  namespace: artflow-dev
type: kubernetes.io/basic-auth
stringData:
  username: artflow_plus
  password: replace-with-a-strong-password
