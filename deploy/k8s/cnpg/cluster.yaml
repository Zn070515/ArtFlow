# CloudNativePG reference cluster for the HA overlay.
# Verify the image tag against the operator release you run; pin the digest in
# production instead of using a floating tag.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plus-db
  namespace: artflow-dev
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  bootstrap:
    initdb:
      database: artflow_plus
      owner: artflow_plus
      secret:
        name: plus-db-app
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://REPLACE-WITH-BACKUP-BUCKET/artflow-pg
      s3Credentials:
        accessKeyId:
          name: plus-db-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: plus-db-s3
          key: SECRET_ACCESS_KEY
        region:
          name: plus-db-s3
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
  monitoring:
    enablePodMonitor: true
