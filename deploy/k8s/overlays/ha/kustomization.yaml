apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: artflow-dev
resources:
  - ../../base
  - pdb.yaml
patches:
  - path: replicas.yaml
  - path: s3-config.yaml
  - path: delete-standalone-db.yaml
  - target:
      kind: Deployment
      name: plus-api
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts
