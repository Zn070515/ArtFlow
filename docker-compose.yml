services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artflow
      POSTGRES_USER: artflow
      POSTGRES_PASSWORD: artflow-local-container-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - artflow_frontend

  web:
    build:
      context: .
      args:
        ARTFLOW_BUILD_SHA: ${ARTFLOW_RELEASE_SHA:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: artflow
      POSTGRES_USER: artflow
      POSTGRES_PASSWORD: artflow-local-container-password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      STAFF_ACCESS_KEY: ${STAFF_ACCESS_KEY:-}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:-}
      ARTFLOW_RELEASE_SHA: ${ARTFLOW_RELEASE_SHA:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/healthz/', timeout=3); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - artflow_frontend

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  # Keep the local web port publishable on Docker Desktop. Attaching the
  # published web container to an internal bridge prevents Docker Desktop
  # 4.82/Engine 29.6 from installing the loopback port binding reliably.
  # The database still has no host port and this network is project-scoped.
  artflow_frontend:
    driver: bridge
