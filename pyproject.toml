[project]
name = "artflow"
version = "0.1.0"
description = "ArtFlow student arts department activity operations platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "asgiref==3.11.1",
    "django==6.0.6",
    "et-xmlfile==2.0.0",
    "openpyxl==3.1.5",
    "pillow==12.2.0",
    "psycopg2-binary==2.9.12",
    "python-docx==1.1.2",
    "python-dotenv>=1.0",
    "qrcode==8.2",
    "sqlparse==0.5.5",
    "tzdata==2026.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.11",
    "ruff>=0.11",
    "mypy>=1.15",
    "django-stubs>=5.2",
]
production = [
    "gunicorn>=23; sys_platform != 'win32'",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "accounts",
    "archive",
    "common",
    "config",
    "core",
    "exports",
    "farewell_show",
    "files",
    "incidents",
    "public_portal",
    "singer_contest",
    "staff_panel",
    "voting",
    "tests",
]
extend-exclude = [
    "**/migrations/*.py",
    "**/__pycache__/**",
    "media/**",
    "staticfiles/**",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
exclude = [
    "**/migrations/*.py",
    "**/__pycache__/**",
    "media/**",
    "staticfiles/**",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = [
    "accounts",
    "archive",
    "common",
    "config",
    "core",
    "exports",
    "farewell_show",
    "files",
    "incidents",
    "public_portal",
    "singer_contest",
    "staff_panel",
    "voting",
]
omit = [
    "*/migrations/*",
    "*/__pycache__/*",
    "media/*",
    "*/media/*",
    "staticfiles/*",
    "*/staticfiles/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
files = [
    "accounts",
    "archive",
    "common",
    "config",
    "core",
    "exports",
    "farewell_show",
    "files",
    "incidents",
    "public_portal",
    "singer_contest",
    "staff_panel",
    "voting",
]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "config",
    "config.*",
    "common",
    "common.*",
    "accounts.management",
    "accounts.management.*",
    "public_portal.management",
    "public_portal.management.*",
]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"
