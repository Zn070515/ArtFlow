[project]
name = "artflow-gates"
version = "0.1.0"
description = "Structural and documentation gates for the ArtFlow-Plus repository"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests/gates", "scripts/tests"]
addopts = "-ra"
