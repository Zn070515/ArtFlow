<form method="post" class="space-y-4">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% if form.non_field_errors %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded" role="alert">
        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
    </div>
    {% endif %}
    <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
        <input id="id_username" type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        {% for error in form.username.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
    </div>
    <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input id="id_password" type="password" name="password" autocomplete="current-password" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        {% for error in form.password.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
    </div>
    <button type="submit" class="w-full bg-brand text-white py-2 rounded text-sm hover:bg-brand-light transition-colors">登录</button>
</form>
