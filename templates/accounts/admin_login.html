{% extends "base.html" %}

{% block title %}管理员登录 - ArtFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 px-4">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">管理员登录</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-2 rounded">
            {% for error in form.non_field_errors %}{{ error }}{% empty %}管理员登录失败{% endfor %}
        </div>
        {% endif %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">管理员账号</label>
            <input type="text" name="username" autocomplete="username" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input type="password" name="password" autocomplete="current-password" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">管理员密钥</label>
            <input type="password" name="admin_key" autocomplete="off" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        </div>
        <button type="submit" class="w-full bg-brand text-white py-2 rounded text-sm hover:bg-brand-light transition-colors">管理员登录</button>
    </form>
    <p class="mt-4 text-sm text-center text-gray-500">
        返回普通入口？<a href="{% url 'accounts:login' %}" class="text-brand hover:underline">普通登录</a>
    </p>
</div>
{% endblock %}
