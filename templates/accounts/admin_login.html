{% extends "base.html" %}

{% block title %}管理员登录 - ArtFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">管理员登录</h1>
    <p class="text-sm text-gray-600 mb-6">使用管理员账号进入高权限管理后台。</p>
    {% include "accounts/_credential_login_form.html" %}
    <p class="mt-4 text-sm text-center text-gray-500">
        返回登录入口？<a href="{% url 'accounts:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="text-brand hover:underline">选择其他入口</a>
    </p>
    <p class="mt-2 text-sm text-center text-gray-500">还没有管理员账号？<a href="{% url 'accounts:admin_register' %}" class="text-brand hover:underline">管理员注册</a></p>
</div>
{% endblock %}
