{% extends "base.html" %}

{% block title %}管理员重置密码 - ArtFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">管理员重置密码</h1>
    <p class="text-sm text-gray-500 mb-6">目标账号：{{ target.username }}。此操作需要管理员二次验证，并会写入审计记录。</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-brand text-white py-2 rounded text-sm">重置密码</button>
    </form>
</div>
{% endblock %}
