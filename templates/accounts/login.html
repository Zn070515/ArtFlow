{% extends "base.html" %}

{% block title %}登录入口 - ArtFlow{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 px-4">
    <h1 class="text-2xl font-bold text-gray-900">选择登录入口</h1>
    <p class="mt-2 text-sm text-gray-600">请选择与账号身份匹配的入口。登录入口不会接收账号或密码。</p>
    <div class="mt-6 grid gap-3 sm:grid-cols-3">
        <a href="{% url 'accounts:participant_login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="rounded-lg border border-gray-200 bg-white p-4 hover:border-brand">
            <span class="block font-semibold text-gray-900">选手登录</span>
            <span class="mt-1 block text-sm text-gray-500">报名、查看和管理自己的活动资料</span>
        </a>
        <a href="{% url 'accounts:staff_login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="rounded-lg border border-gray-200 bg-white p-4 hover:border-brand">
            <span class="block font-semibold text-gray-900">工作人员登录</span>
            <span class="mt-1 block text-sm text-gray-500">现场运营、审核和评分工作</span>
        </a>
        <a href="{% url 'accounts:admin_login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="rounded-lg border border-gray-200 bg-white p-4 hover:border-brand">
            <span class="block font-semibold text-gray-900">管理员登录</span>
            <span class="mt-1 block text-sm text-gray-500">管理账户、配置和高风险操作</span>
        </a>
    </div>
    <div class="mt-6 border-t border-gray-100 pt-5 text-center text-sm text-gray-500">
        <p>还没有账号？选择对应身份注册：</p>
        <div class="mt-2 flex flex-wrap justify-center gap-x-4 gap-y-1">
            <a href="{% url 'accounts:register' %}" class="text-brand hover:underline">选手注册</a>
            <a href="{% url 'accounts:staff_register' %}" class="text-brand hover:underline">工作人员注册</a>
            <a href="{% url 'accounts:admin_register' %}" class="text-brand hover:underline">管理员注册</a>
        </div>
    </div>
</div>
{% endblock %}
