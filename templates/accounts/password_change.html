{% extends "base.html" %}

{% block title %}修改密码 - ArtFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">修改密码</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-brand text-white py-2 rounded text-sm">保存新密码</button>
    </form>
</div>
{% endblock %}
