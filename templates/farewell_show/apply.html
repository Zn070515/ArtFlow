{% extends "base.html" %}

{% block title %}毕晚节目征集 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">毕晚节目征集</h1>

    {% if not activities %}
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-8 text-center text-gray-500">
        <p>当前没有开放征集的毕晚活动</p>
    </div>
    {% else %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">选择活动</label>
            <select name="activity_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand">
                {% for a in activities %}
                <option value="{{ a.pk }}">{{ a.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">节目名称</label>
            <input type="text" name="name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">节目类型</label>
            <select name="program_type" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand">
                <option value="song">歌曲</option>
                <option value="dance">舞蹈</option>
                <option value="instrument">器乐</option>
                <option value="drama">戏剧/小品</option>
                <option value="recitation">朗诵</option>
                <option value="other">其他</option>
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">负责人姓名</label>
                <input type="text" name="contact_name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">联系方式</label>
                <input type="text" name="contact_phone" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">所属班级/部门</label>
            <input type="text" name="class_name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">演员名单</label>
            <textarea name="performers" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">预计时长</label>
            <input type="text" name="estimated_duration" placeholder="如：5分钟" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">节目简介</label>
            <textarea name="description" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">麦克风需求</label>
            <input type="text" name="mic_requirements" placeholder="如：手持2个、立麦1个" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">道具需求</label>
            <input type="text" name="prop_requirements" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">特殊备注</label>
            <textarea name="special_notes" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light transition-colors">提交节目</button>
    </form>
    {% endif %}
</div>
{% endblock %}
