{% extends "base.html" %}

{% block title %}{{ activity.title }} · 评委入口{% endblock %}

{% block content %}
<main class="mx-auto max-w-xl px-4 py-10">
    <p class="text-sm text-gray-500"><a class="underline" href="{% url 'public_portal:activity_entry' activity.public_code %}">{{ activity.title }}</a></p>
    <h1 class="mt-2 text-3xl font-bold text-gray-900">评委入口</h1>
    <section class="mt-8 rounded border border-gray-200 bg-white p-5">
        <p class="font-medium text-gray-900">评委终端将在现场准备完成后开放。</p>
        <p class="mt-2 text-sm text-gray-600">请使用工作人员提供的现场指引进入评分终端。</p>
    </section>
</main>
{% endblock %}
