{% extends "base.html" %}

{% block title %}歌手比赛报名 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">歌手比赛报名</h1>

    {% if errors %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded mb-4">
        {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
    {% endif %}

    {% if not activities %}
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-8 text-center text-gray-500">
        <p>当前没有开放报名的歌手比赛</p>
    </div>
    {% else %}
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">选择活动</label>
            <select name="activity_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand">
                {% for a in activities %}
                <option value="{{ a.pk }}">{{ a.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                <input type="text" name="name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">学号</label>
                <input type="text" name="student_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">学院</label>
                <input type="text" name="college" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">班级</label>
                <input type="text" name="class_name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                <input type="text" name="phone" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">微信号（选填）</label>
                <input type="text" name="wechat" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">曲目名称</label>
            <input type="text" name="song_name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" name="is_original" class="rounded"> 原创作品
            </label>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">节目简介</label>
            <textarea name="description" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
            <textarea name="remark" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <div class="border-t border-gray-200 pt-4 space-y-3">
            <h2 class="text-sm font-medium text-gray-900">报名材料</h2>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">伴奏文件</label>
                <input type="file" name="accompaniment" class="text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">演唱视频（可选）</label>
                <input type="file" name="performance_video" class="text-sm">
            </div>
        </div>
        <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light transition-colors">提交报名</button>
    </form>
    {% endif %}
</div>
{% endblock %}
