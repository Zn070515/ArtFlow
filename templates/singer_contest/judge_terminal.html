{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="mx-auto max-w-xl p-6" data-judge-terminal
      data-redeem-url="{% url 'entry_access:grant_redeem' %}"
      data-context-url="{% url 'judge:context' %}"
      data-score-url="{% url 'judge:score' %}">
  <h1 class="text-2xl font-semibold">评委评分终端</h1>
  <p data-status class="mt-3" role="status">正在准备评委会话……</p>
  <section class="mt-6 rounded border p-4" aria-live="polite">
    <p>轮次：<span data-round>—</span></p>
    <p>表演：<span data-performance-label>—</span></p>
    <p>选手：<span data-singer>—</span></p>
    <p>曲目：<span data-song>—</span></p>
    <p>状态：<span data-performance-state>—</span></p>
  </section>
  <section class="mt-6">
    <h2 class="font-semibold">分项评分</h2>
    <div data-criteria class="mt-2 space-y-3"></div>
    <p class="mt-3">当前合计：<output data-total>0.00</output></p>
  </section>
  <label class="mt-6 block">总分（无分项评分标准时）
    <input data-score class="mt-1 block w-full rounded border p-2" inputmode="decimal" autocomplete="off">
  </label>
  <label class="mt-4 block">备注（可选）
    <textarea data-notes class="mt-1 block w-full rounded border p-2" maxlength="200"></textarea>
  </label>
  <button data-submit class="mt-6 rounded bg-indigo-600 px-4 py-2 text-white" type="button" disabled>提交评分</button>
</main>
{% endblock %}

{% block extra_js %}
<script src="{% static 'dist/judge_terminal.js' %}" defer></script>
{% endblock %}
