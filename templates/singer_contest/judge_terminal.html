{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="mx-auto max-w-xl p-6" data-judge-terminal
      data-redeem-url="{% url 'entry_access:grant_redeem' %}"
      data-context-url="{% url 'judge:context' %}"
      data-score-url="{% url 'judge:score' %}">
  <h1 class="text-2xl font-semibold">评委评分终端</h1>
  <p data-status class="mt-3" role="status">正在准备评委会话……</p>
  <label class="mt-6 block">分数
    <input data-score class="mt-1 block w-full rounded border p-2" inputmode="decimal" autocomplete="off">
  </label>
  <label class="mt-4 block">备注（可选）
    <textarea data-notes class="mt-1 block w-full rounded border p-2" maxlength="200"></textarea>
  </label>
  <button data-submit class="mt-6 rounded bg-indigo-600 px-4 py-2 text-white" type="button">提交评分</button>
</main>
{% endblock %}

{% block extra_js %}
<script src="{% static 'dist/judge_terminal.js' %}" defer></script>
{% endblock %}
