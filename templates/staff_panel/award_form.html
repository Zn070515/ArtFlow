{% extends "base.html" %}

{% block title %}颁发奖项 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">颁发奖项</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">活动</label>
            <select name="activity_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for a in activities %}<option value="{{ a.pk }}">{{ a.title }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">选手</label>
            <select name="singer_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for s in singers %}<option value="{{ s.pk }}">{{ s.name }} — {{ s.song_name }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">奖项名称</label>
            <input type="text" name="name" required placeholder="如：十佳歌手、一等奖、最佳人气奖" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light">保存</button>
    </form>
</div>
{% endblock %}
