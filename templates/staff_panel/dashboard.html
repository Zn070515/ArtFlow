{% extends "base.html" %}

{% block title %}工作人员后台 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">工作人员后台</h1>
    <p class="text-sm text-gray-500 mb-8">欢迎，{{ user.username }}</p>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <a href="{% url 'staff:post_list' %}" class="block border border-gray-200 bg-white rounded-lg p-5 hover:border-gray-300 transition-colors">
            <h3 class="font-medium text-gray-900">公开内容管理</h3>
            <p class="mt-1 text-sm text-gray-500">管理首页展示、往届风采、通知公告、结果公示</p>
        </a>
        <div class="border border-gray-100 bg-gray-50 rounded-lg p-5 text-gray-400">
            <h3 class="font-medium">活动管理</h3>
            <p class="mt-1 text-sm">后续开放</p>
        </div>
        <div class="border border-gray-100 bg-gray-50 rounded-lg p-5 text-gray-400">
            <h3 class="font-medium">报名管理</h3>
            <p class="mt-1 text-sm">后续开放</p>
        </div>
        <div class="border border-gray-100 bg-gray-50 rounded-lg p-5 text-gray-400">
            <h3 class="font-medium">歌手比赛评分</h3>
            <p class="mt-1 text-sm">后续开放</p>
        </div>
        <div class="border border-gray-100 bg-gray-50 rounded-lg p-5 text-gray-400">
            <h3 class="font-medium">观众投票</h3>
            <p class="mt-1 text-sm">后续开放</p>
        </div>
        <div class="border border-gray-100 bg-gray-50 rounded-lg p-5 text-gray-400">
            <h3 class="font-medium">导出中心</h3>
            <p class="mt-1 text-sm">后续开放</p>
        </div>
    </div>
</div>
{% endblock %}
