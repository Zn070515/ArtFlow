{% extends "base.html" %}

{% block title %}添加异常记录 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">添加异常记录</h1>
    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2 rounded">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_activity_id" class="block text-sm font-medium text-gray-700 mb-1">活动</label>
            <select id="id_activity_id" name="activity_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for a in activities %}<option value="{{ a.pk }}"{% if selected_activity_id|stringformat:"s" == a.pk|stringformat:"s" %} selected{% endif %}>{{ a.title }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label for="id_occurred_at" class="block text-sm font-medium text-gray-700 mb-1">发生时间</label>
            <input id="id_occurred_at" type="datetime-local" name="occurred_at" value="{{ form_data.occurred_at|default:"" }}" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label for="id_event_type" class="block text-sm font-medium text-gray-700 mb-1">事件类型</label>
            <select id="id_event_type" name="event_type" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for val, label in event_types %}<option value="{{ val }}"{% if form_data.event_type == val %} selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label for="id_round_id" class="block text-sm font-medium text-gray-700 mb-1">涉及轮次</label>
            <select id="id_round_id" name="round_id" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                <option value="">—— 无 ——</option>
                {% for r in rounds %}<option value="{{ r.pk }}"{% if selected_round_id|stringformat:"s" == r.pk|stringformat:"s" %} selected{% endif %}>{{ r.name|default:"（未命名轮次）" }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label for="id_authority_state" class="block text-sm font-medium text-gray-700 mb-1">事发时 authority 状态</label>
            <select id="id_authority_state" name="authority_state" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for val, label in authority_states %}<option value="{{ val }}"{% if form_data.authority_state == val %} selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label for="id_singer_id" class="block text-sm font-medium text-gray-700 mb-1">涉及选手</label>
            <select id="id_singer_id" name="singer_id" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                <option value="">—— 无 ——</option>
                {% for s in singers %}<option value="{{ s.pk }}"{% if selected_singer_id|stringformat:"s" == s.pk|stringformat:"s" %} selected{% endif %}>{{ s.name }} — {{ s.song_label }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label for="id_resolution" class="block text-sm font-medium text-gray-700 mb-1">处理结果</label>
            <input id="id_resolution" type="text" name="resolution" value="{{ form_data.resolution|default:"" }}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label for="id_remark" class="block text-sm font-medium text-gray-700 mb-1">备注</label>
            <textarea id="id_remark" name="remark" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">{{ form_data.remark|default:"" }}</textarea>
        </div>
        <div class="flex items-center gap-2">
            <input id="id_needs_review" type="checkbox" name="needs_review" value="1" {% if form_data.needs_review %}checked{% endif %} class="h-4 w-4 text-brand border-gray-300">
            <label for="id_needs_review" class="text-sm text-gray-700">需要赛后复盘</label>
        </div>
        <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light">添加</button>
    </form>
</div>
{% endblock %}
