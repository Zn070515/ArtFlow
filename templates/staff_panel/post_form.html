{% extends "base.html" %}

{% block title %}{% if post %}编辑{% else %}新增{% endif %}内容 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">{% if post %}编辑内容{% else %}新增公开内容{% endif %}</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
            <input type="text" name="title" value="{{ post.title|default:'' }}" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">副标题</label>
            <input type="text" name="subtitle" value="{{ post.subtitle|default:'' }}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">类型</label>
                <select name="post_type" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
                    {% for value, label in post_types %}
                    <option value="{{ value }}" {% if post.post_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                <select name="status" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
                    {% for value, label in statuses %}
                    <option value="{{ value }}" {% if post.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">排序（数字越小越靠前）</label>
            <input type="number" name="sort_order" value="{{ post.sort_order|default:'0' }}" class="w-24 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">封面图片</label>
            {% if post.cover_image %}<p class="text-xs text-gray-500 mb-1">当前：{{ post.cover_image.name }}</p>{% endif %}
            <input type="file" name="cover_image" class="text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">正文</label>
            <textarea name="content" rows="8" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand">{{ post.content|default:'' }}</textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light transition-colors">保存</button>
            <a href="{% url 'staff:post_list' %}" class="border border-gray-300 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-50 transition-colors">取消</a>
        </div>
    </form>
</div>
{% endblock %}
