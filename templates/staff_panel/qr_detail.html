{% extends "base.html" %}

{% block title %}{{ activity.title }} 二维码 - ArtFlow{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">{{ activity.title }} 二维码</h1>
    <p class="text-sm text-gray-500 mb-6">
        <a href="{% url 'staff:dashboard' %}" class="hover:underline">后台</a> /
        <a href="{% url 'staff:qr_center' %}" class="hover:underline">二维码中心</a> / {{ activity.title }}
    </p>

    <div class="grid sm:grid-cols-3 gap-6">
        <div class="border border-gray-200 bg-white rounded-lg p-6 text-center">
            <h3 class="font-medium text-gray-900 mb-3">报名入口</h3>
            <img src="{% url 'staff:qr_image' activity.pk 'registration' %}" alt="报名二维码" class="w-40 h-40 mx-auto border border-gray-200 rounded">
            <a href="{% url 'staff:qr_image' activity.pk 'registration' %}" download class="inline-block mt-3 text-xs text-brand hover:underline">下载 PNG</a>
        </div>

        <div class="border border-gray-200 bg-white rounded-lg p-6 text-center">
            <h3 class="font-medium text-gray-900 mb-3">投票入口</h3>
            {% if activity.vote_sessions.exists %}
            <img src="{% url 'staff:qr_image' activity.pk 'vote' %}" alt="投票二维码" class="w-40 h-40 mx-auto border border-gray-200 rounded">
            <a href="{% url 'staff:qr_image' activity.pk 'vote' %}" download class="inline-block mt-3 text-xs text-brand hover:underline">下载 PNG</a>
            {% else %}
            <div class="w-40 h-40 mx-auto border border-dashed border-gray-200 rounded flex items-center justify-center text-xs text-gray-400">暂无投票场次</div>
            {% endif %}
        </div>

        <div class="border border-gray-200 bg-white rounded-lg p-6 text-center">
            <h3 class="font-medium text-gray-900 mb-3">结果公示</h3>
            <img src="{% url 'staff:qr_image' activity.pk 'results' %}" alt="结果二维码" class="w-40 h-40 mx-auto border border-gray-200 rounded">
            <a href="{% url 'staff:qr_image' activity.pk 'results' %}" download class="inline-block mt-3 text-xs text-brand hover:underline">下载 PNG</a>
        </div>
    </div>
</div>
{% endblock %}
