{% extends "base.html" %}

{% block title %}新增轮次 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">新增比赛轮次</h1>
    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2 rounded">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">活动</label>
            <select name="activity_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for a in activities %}<option value="{{ a.pk }}">{{ a.title }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">轮次名称</label>
            <input type="text" name="name" placeholder="如：十佳歌手初赛" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">轮次类型</label>
            <select name="round_type" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for value, label in round_types %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">计分方式</label>
            <select name="scoring_mode" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for value, label in scoring_modes %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">轮次序号</label>
            <input type="number" name="sequence" value="1" min="1" class="w-24 border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">晋级名单来源</label>
            <select name="roster_source" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for value, label in roster_sources %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">上游赛段（赛段晋级时必填）</label>
            <input type="text" name="roster_source_stage" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">评分规则</label>
            <select name="rubric" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                <option value="">（无）</option>
                {% for r in rubrics %}
                <option value="{{ r.pk }}">{{ r.name }}（{{ r.activity.title }}）</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">晋级人数（0 表示不限制）</label>
            <input type="number" name="advance_count" value="0" class="w-24 border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light">创建轮次</button>
    </form>
</div>
{% endblock %}
