{% extends "base.html" %}

{% block title %}创建投票场次 — ArtFlow{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">创建投票场次</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">活动</label>
            <select name="activity_id" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for a in activities %}<option value="{{ a.pk }}">{{ a.title }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">场次名称</label>
            <input type="text" name="name" required placeholder="如：最佳人气奖投票" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">现场口令</label>
            <input type="text" name="passcode" required placeholder="观众入场时输入的口令" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">开始时间</label>
                <input type="datetime-local" name="start_time" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">结束时间</label>
                <input type="datetime-local" name="end_time" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">投票方式</label>
            <select name="selection_type" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                {% for val, label in selection_types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">最多可选项数（多选时有效）</label>
            <input type="number" name="max_selections" value="1" min="1" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">候选选手（可多选）</label>
            <div class="border border-gray-300 rounded px-3 py-2 max-h-48 overflow-y-auto space-y-1">
                {% for s in singers %}
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" name="singers" value="{{ s.pk }}">
                    {{ s.name }} — {{ s.song_name }}
                </label>
                {% empty %}
                <p class="text-gray-400 text-sm">暂无可选选手，请先审核通过选手</p>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="bg-brand text-white px-4 py-2 rounded text-sm hover:bg-brand-light">创建</button>
    </form>
</div>
{% endblock %}
